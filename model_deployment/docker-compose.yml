version: '3.8'

services:
  api:
     build: .
     container_name: sentiment_api 
     ports:
        - "8000:8000"
     volumes:
        - ./models:/app/models
        - ./mlruns:/app/mlruns 
     command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  streamlit:
     build: .
     container_name: sentiment_streamlit 
     ports: 
        - "8501:8501"
     environment:
        - API_URL=http://api:8000

     volumes:
        - ./streamlit:/app/streamlit
     command: streamlit run streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0
     depends_on:
       - api